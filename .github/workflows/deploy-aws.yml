name: Build and deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sixth-lens-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://sixthlense.com

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::494934332052:role/GitHubActionsSixthLensDeploy
          aws-region: us-west-2
          allowed-account-ids: "494934332052"
          role-session-name: sixth-lens-${{ github.run_id }}

      - name: Upload versioned assets
        run: |
          aws s3 sync out/ s3://sixthlense-com-494934332052 \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --exclude "*.webmanifest"

      - name: Upload HTML and SEO files
        run: |
          aws s3 sync out/ s3://sixthlense-com-494934332052 \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.txt" \
            --include "*.webmanifest"

      - name: Clear CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EAXGJOPZ85I2R --paths "/*"

      - name: Verify production
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 https://sixthlense.com/ | grep -q "Your business"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
